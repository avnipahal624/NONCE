name: NONCE verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonce-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Frontend and Convex unit checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create an isolated local Convex deployment
        run: bunx convex deployment create local --select
      - name: Configure local Convex auth
        run: |
          bunx convex env set --deployment local VLY_CONVEX_AUTH_ISSUER https://nonce-ci.invalid
          bunx convex env set --deployment local CONVEX_SITE_URL http://localhost:5173
      - name: Generate Convex types
        run: bunx convex dev --once
      - name: TypeScript
        run: bun tsc -b --noEmit
      - name: Lint
        run: bun run lint
      - name: Backend and policy tests
        run: bun run test
      - name: Production build
        run: bun run build

  contracts:
    name: Foundry build and test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Run unit, invariant, fuzz and Base Sepolia fork tests
        working-directory: contracts
        run: forge test -vvv
